name: Actualizar PML MDA y MTR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-pml:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Procesar PML MDA y MTR
        run: |
          python scripts/procesar_pml.py

      - name: Guardar datos del dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard_data/

          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualizar PML MDA y MTR"
            git push
          fi
