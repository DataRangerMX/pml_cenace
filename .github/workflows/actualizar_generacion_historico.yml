name: Generación SIM SEN L0 - histórico y mensual

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'historico: carga desde 2022 / mensual: revisión de meses recientes'
        required: true
        default: 'historico'
        type: choice
        options:
          - historico
          - mensual
  schedule:
    # 06:00 Ciudad de México (UTC-6), días 14 al 18; cubre retrasos de publicación.
    - cron: '0 12 14-18 * *'

permissions:
  contents: write

concurrency:
  group: generacion-sim-actualizacion
  cancel-in-progress: false

jobs:
  generacion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Descargar y validar reportes
        shell: bash
        env:
          MODO_MANUAL: ${{ inputs.modo }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "schedule" ]; then
            MODO="mensual"
          else
            MODO="${MODO_MANUAL:-historico}"
          fi
          python scripts/actualizar_generacion_historico.py --modo "$MODO" --desde 2022-01 --revisar-meses 2 --pausa 2
      - name: Publicar archivos validados
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generacion_data/
          if git diff --cached --quiet; then
            echo 'Sin cambios para publicar'
          else
            git commit -m 'Actualizar histórico generación L0 SEN'
            git push
          fi
      - name: Guardar resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generacion-sen-l0
          path: generacion_data/
          if-no-files-found: warn
