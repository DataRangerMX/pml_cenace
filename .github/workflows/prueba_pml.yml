name: Prueba SW-PML CENACE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  consultar-pml:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Ejecutar consulta SW-PML
        run: python scripts/descargar_pml.py


      - name: Guardar datos obtenidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos_pml.json

          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualizar datos PML"
            git push
          fi
